<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIO — Expressions</title>
  <link rel="stylesheet" href="/static/main.css?v=20260511-3">
</head>
<body>
  <main class="page">

    <div class="container" aria-hidden="true">
      <div id="emotion_area" class="area" role="img" aria-label="Eyes">
        <img id="eyesImg" src="/assets/animatedEyes/neutralEyesGIF.gif" alt="Eyes">
      </div>
      <div id="speech_area" class="area" role="img" aria-label="Mouth">
        <img id="mouthImg" src="/assets/animatedNoSpeeches/neutral_notSpeakGIF.gif" alt="Mouth">
      </div>
    </div>

    <button id="micBtn" type="button" title="Voice input">
      <span class="mic-glyph" aria-hidden="true">🎤</span>
      <span class="mic-on-label" hidden>On</span>
    </button>

    <button type="button" id="chatToggle" class="chat-toggle" aria-controls="chatPanel" aria-expanded="false">
      Chat
    </button>

    <aside id="chatPanel" class="chat-panel" aria-label="Conversation with RIO" hidden>
      <header class="chat-panel-header">
        <span class="chat-panel-title">Chat</span>
        <span id="emotionState" class="emotion-chip">Warm and receptive</span>
        <button type="button" id="chatClose" class="chat-close" title="Close chat">×</button>
      </header>
      <div id="conversationLog" class="conversation-log">
        <p id="logPlaceholder" class="log-placeholder">Tap Chat to talk with RIO.</p>
      </div>
      <div id="micHint" class="mic-hint" aria-live="polite"></div>
      <div id="playPromptHost"></div>
      <section class="chat-input-row" aria-label="Type a message">
        <span id="micDot" class="mic-dot off" title="Connecting..."></span>
        <input type="text" id="userInput" placeholder="Tell me how you're feeling..." autocomplete="off" />
        <button id="sendBtn" type="button">Send</button>
      </section>
    </aside>

    <audio id="audioPlayer" style="display:none"></audio>

    <p class="footer-hint">Open <a href="/details">/details</a> for live perception debug.</p>
  </main>

  <script src="/static/app.js?v=20260511-3"></script>
  <script src="/static/mic_bridge.js?v=20260511-3"></script>
</body>
</html>
